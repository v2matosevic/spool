name: Desktop release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag matching runtime.VERSION (for example v1.5.0)
        required: true
        type: string
      native_check:
        description: Run disposable native desktop checks (opens/closes the test app windows)
        required: true
        default: true
        type: boolean
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: python -m pip install pip-audit
      - run: pip-audit -r requirements.txt
      - run: pip-audit -r requirements-spotify.txt
  build:
    needs: audit
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
          - os: macos-15
            artifact: macos-arm64
          - os: macos-15-intel
            artifact: macos-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate tag
        env:
          SPOOL_TAG: ${{ inputs.tag }}
        run: python -c "import os,runtime; assert os.environ['SPOOL_TAG']=='v'+runtime.VERSION"
      - run: python -m pip install -r requirements-build.txt -r requirements-dev.txt
      - name: Isolate Intel cryptography OpenSSL linkage
        if: matrix.artifact == 'macos-x86_64'
        shell: bash
        run: |
          export OPENSSL_STATIC=1
          export OPENSSL_DIR="$(brew --prefix openssl@3)"
          python -m pip install --force-reinstall --no-cache-dir --no-binary=cryptography cryptography==50.0.2
          python -c "from cryptography.hazmat.bindings import _rust; import subprocess; deps=subprocess.check_output(['otool','-L',_rust.__file__],text=True); print(deps); assert 'libssl' not in deps and 'libcrypto' not in deps"
      - run: python scripts/setup_spotify.py
      - run: python scripts/check_public.py
      - run: node --check static/app.js
      - run: python -m pytest -q
      - name: Restore verified FFmpeg build
        id: tools-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            build/release-tools/prefix
            build/ffmpeg-source-records
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-v1-${{ hashFiles('scripts/build_ffmpeg.sh') }}
      - name: Windows build tools in disposable runner
        if: runner.os == 'Windows' && steps.tools-cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MINGW64
          update: true
          install: make curl tar pkgconf mingw-w64-x86_64-gcc
      - name: Build standalone LGPL FFmpeg (Windows)
        if: runner.os == 'Windows' && steps.tools-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash scripts/build_ffmpeg.sh
      - name: Build standalone LGPL FFmpeg (macOS)
        if: runner.os == 'macOS' && steps.tools-cache.outputs.cache-hit != 'true'
        run: bash scripts/build_ffmpeg.sh
      - name: Save verified source/tool component
        if: steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            build/release-tools/prefix
            build/ffmpeg-source-records
          key: ${{ steps.tools-cache.outputs.cache-primary-key }}
      - run: python scripts/collect_sources.py
      - name: Freeze desktop app
        shell: bash
        run: |
          export SPOOL_RELEASE_TOOLS="$(python -c 'from pathlib import Path; print(Path.cwd()/"build/release-tools/prefix/bin")')"
          export SPOOL_RELEASE_SOURCES="$(python -c 'from pathlib import Path; print(Path.cwd()/"build/release-sources")')"
          python scripts/build_desktop.py --release
      - name: Windows installer
        if: runner.os == 'Windows'
        run: python scripts/build_installer.py
      - run: python scripts/verify_release.py
      - name: Verify disposable desktop window
        if: inputs.native_check
        run: python scripts/verify_native_release.py
      - name: Archive corresponding source
        shell: bash
        env:
          SPOOL_TARGET: ${{ matrix.artifact }}
        run: python -c "import os,shutil,runtime; shutil.make_archive('dist/Spool-'+runtime.VERSION+'-'+os.environ['SPOOL_TARGET']+'-third-party-source','zip','build','release-sources')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/Spool-*.exe
            dist/Spool-*.zip
            dist/Spool-*.dmg
            dist/Spool-*-verification.json
            dist/Spool-*-native.png
          if-no-files-found: error
          retention-days: 7
      - name: Preserve packaging failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: failure-${{ matrix.artifact }}
          path: |
            build/packaging.log
            build/bundle-packaging.log
            build/spotify-packaging.log
            dist/Spool-*.zip
            dist/Spool-*.dmg
          if-no-files-found: ignore
          retention-days: 3
  publish:
    if: inputs.native_check
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Validate release inventory
        env:
          SPOOL_TAG: ${{ inputs.tag }}
        run: python scripts/finish_release.py "$SPOOL_TAG"
      - name: Publish checked artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SPOOL_TAG: ${{ inputs.tag }}
          SPOOL_COMMIT: ${{ github.sha }}
        run: gh release create "$SPOOL_TAG" dist/* --target "$SPOOL_COMMIT" --title "Spool $SPOOL_TAG" --notes-file build/release-notes.md
      - name: Attest release provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: dist/*
