name: Desktop release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag matching runtime.VERSION (for example v1.5.0)
        required: true
        type: string
      native_check:
        description: Run disposable native desktop checks (opens/closes the test app windows)
        required: true
        default: true
        type: boolean
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install pip-audit
      - run: pip-audit -r requirements.txt
      - run: pip-audit -r requirements-spotify.txt
  build:
    needs: audit
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
          - os: macos-15
            artifact: macos-arm64
          - os: macos-15-intel
            artifact: macos-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Validate tag
        env:
          SPOOL_TAG: ${{ inputs.tag }}
        run: python -c "import os,runtime; assert os.environ['SPOOL_TAG']=='v'+runtime.VERSION"
      - run: python -m pip install -r requirements-build.txt -r requirements-dev.txt
      - run: python scripts/setup_spotify.py
      - run: python scripts/check_public.py
      - run: node --check static/app.js
      - run: python -m pytest -q
      - name: Restore verified FFmpeg build
        id: tools-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/release-tools/prefix
            build/ffmpeg-source-records
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-v1-${{ hashFiles('scripts/build_ffmpeg.sh') }}
      - name: Windows build tools in disposable runner
        if: runner.os == 'Windows' && steps.tools-cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MINGW64
          update: true
          install: make curl tar pkgconf mingw-w64-x86_64-gcc
      - name: Build standalone LGPL FFmpeg (Windows)
        if: runner.os == 'Windows' && steps.tools-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash scripts/build_ffmpeg.sh
      - name: Build standalone LGPL FFmpeg (macOS)
        if: runner.os == 'macOS' && steps.tools-cache.outputs.cache-hit != 'true'
        run: bash scripts/build_ffmpeg.sh
      - run: python scripts/collect_sources.py
      - name: Freeze desktop app
        shell: bash
        run: |
          export SPOOL_RELEASE_TOOLS="$(python -c 'from pathlib import Path; print(Path.cwd()/"build/release-tools/prefix/bin")')"
          export SPOOL_RELEASE_SOURCES="$(python -c 'from pathlib import Path; print(Path.cwd()/"build/release-sources")')"
          python scripts/build_desktop.py --release
      - name: Windows installer
        if: runner.os == 'Windows'
        run: python scripts/build_installer.py
      - run: python scripts/verify_release.py
      - name: Verify disposable desktop window
        if: inputs.native_check
        run: python scripts/verify_native_release.py
      - name: Archive corresponding source
        shell: bash
        env:
          SPOOL_TARGET: ${{ matrix.artifact }}
        run: python -c "import os,shutil,runtime; shutil.make_archive('dist/Spool-'+runtime.VERSION+'-'+os.environ['SPOOL_TARGET']+'-third-party-source','zip','build','release-sources')"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/Spool-*.exe
            dist/Spool-*.zip
            dist/Spool-*.dmg
            dist/Spool-*-verification.json
            dist/Spool-*-native.png
          if-no-files-found: error
          retention-days: 7
  publish:
    if: inputs.native_check
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Validate release inventory
        env:
          SPOOL_TAG: ${{ inputs.tag }}
        run: python scripts/finish_release.py "$SPOOL_TAG"
      - name: Publish checked artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SPOOL_TAG: ${{ inputs.tag }}
          SPOOL_COMMIT: ${{ github.sha }}
        run: gh release create "$SPOOL_TAG" dist/* --target "$SPOOL_COMMIT" --title "Spool $SPOOL_TAG" --notes-file build/release-notes.md
      - name: Attest release provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/*
