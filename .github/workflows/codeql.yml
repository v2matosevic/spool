name: Code security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 6 * * 1'
permissions:
  contents: read
  security-events: write
jobs:
  analyze:
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: github/codeql-action/init@cf12ceefebab2c867b9c35d7f907e059681d37ab # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@cf12ceefebab2c867b9c35d7f907e059681d37ab # v3
